name: Record homepage rebuild candidate

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/record-homepage-candidate.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Update project records
        run: |
          python - <<'PY'
          from pathlib import Path

          source = '0c828a806093e7b287b4228170d60a6602cf14b7'
          preview_run = '34983063215'

          # Decision log
          p = Path('docs/visual-refresh/DECISIONS.md')
          s = p.read_text()
          marker = '---\n\n## Current pending decisions'
          if '## D025 — Homepage structural rebuild candidate' not in s:
              block = f'''---\n\n## D025 — Homepage structural rebuild candidate\n**Status:** Candidate — pending preview KEEP / ADJUST / REJECT\n\nRebuild the homepage composition against the approved desktop/mobile/dark-mode direction and locked homepage copy.\n\nCandidate rules:\n- remove the old generic card-heavy homepage structure\n- preserve the approved copy and one-headline/one-support-layer density rule\n- use open editorial grids/rules for What we fix and Core offers\n- use a flat teal split composition for Good fit\n- treat Instant Snapshot as a bounded technical instrument rather than a generic SaaS card\n- use the approved concept-faithful logo, Barlow Condensed headings, Inter body copy and paper/ink/coral/teal/mustard system\n- preserve Snapshot form IDs, strategy radio values and diagnostic-to-Contact handoff behaviour\n- production remains untouched\n\nReviewed source: `{source}`.\nPreview run: `{preview_run}` — build and deploy successful.\n\n'''
              s = s.replace(marker, block + marker, 1)
          pending = '## Current pending decisions\n'
          if '- Homepage structural rebuild candidate: preview KEEP / ADJUST / REJECT.\n' not in s:
              s = s.replace(pending, pending + '- Homepage structural rebuild candidate: preview KEEP / ADJUST / REJECT.\n', 1)
          p.write_text(s)

          # Handoff current state
          p = Path('docs/visual-refresh/HANDOFF.md')
          s = p.read_text()
          start = s.index('## Preview state')
          end = s.index('## Later implementation sequence', start)
          state = f'''## Preview state\nHomepage structural rebuild candidate is deployed for review.\n\nReviewed source:\n`{source}`\n\nPreview run:\n`{preview_run}` — build success, deploy success.\n\nWhat changed in this candidate:\n- old homepage card grids removed from What we fix, Core offers and Good fit\n- hero rebuilt as an asymmetric editorial layout with a technical system-map graphic\n- approved locked homepage wording applied\n- service section rebuilt as an open ruled grid\n- Good fit rebuilt as a teal split section + ruled list\n- Instant Snapshot rebuilt as a technical instrument panel while preserving functional IDs/values\n- final CTA rebuilt as a flat mustard editorial band\n- responsive mobile stacking added\n- dark mode continues to use the same flat editorial system\n\nProduction `main` remains untouched.\n\n## Immediate next step\nUser reviews `https://preview.digitful.ca/` on desktop/mobile and light/dark.\n\nReview scope:\n- overall structure and section order\n- hero scale/composition\n- whether open grids feel sufficiently non-card-like\n- teal Good fit section\n- Instant Snapshot layout and functional check\n- final mustard CTA\n- spacing/readability on phone and laptop\n\nResponse: KEEP / ADJUST / REJECT for the homepage structural rebuild.\n\nDo not adapt service/contact/blog page types until this homepage candidate is reviewed.\n\n'''
          s = s[:start] + state + s[end:]
          p.write_text(s)

          # Change log
          p = Path('docs/visual-refresh/CHANGELOG.md')
          s = p.read_text().rstrip() + '\n\n'
          if '### Homepage structural rebuild candidate' not in s:
              s += f'''### Homepage structural rebuild candidate\n- Status: **PENDING USER REVIEW**.\n- Reviewed source: `{source}`.\n- Preview run `{preview_run}`: build **success**, deploy **success**.\n- Replaced the old homepage card-heavy composition with the approved editorial structure and locked copy.\n- Added `src/assets/_homepage.scss`, scoped to `.home-page`, and loaded it after the shared editorial foundation layer.\n- Hero is now asymmetric with a technical system-map graphic and approved CTA wording.\n- What we fix uses a three-column ruled editorial list rather than cards.\n- Core offers uses a two-by-two open ruled service grid rather than legacy service cards.\n- Good fit uses a flat teal intro field plus a ruled list.\n- Instant Snapshot is now a bordered technical instrument panel; existing form IDs, radio values, result container and `snapshot.js` integration are preserved.\n- Final CTA is a flat mustard band using the approved `Bring the messy version.` copy.\n- Added single-column mobile adaptations and preserved reduced-motion behaviour.\n- Production remains untouched.\n\n### Next action\n- Review homepage on desktop/mobile and light/dark.\n- Confirm Snapshot still runs and diagnostic-to-Contact handoff still works.\n- Mark the homepage structural candidate KEEP / ADJUST / REJECT before adapting other page types.\n'''
          p.write_text(s)
          PY

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "docs: record homepage rebuild candidate [skip ci]"
          git push origin visual-refresh
