name: Align homepage handoff state

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/fix-homepage-handoff-state.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh
      - name: Fix stale foundation note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/visual-refresh/HANDOFF.md')
          s = p.read_text()
          old = '''Important: the homepage has **not** yet been rebuilt to match the approved specimen. Its old card-heavy section structure remains while inheriting the new foundation layer.\n'''
          new = '''The homepage has now moved beyond this foundation-only state: the structural rebuild candidate is deployed and documented below. The foundation layer remains part of that candidate.\n'''
          if old not in s:
              raise SystemExit('Expected stale note not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/HANDOFF.md
          git commit -m "docs: align homepage handoff state [skip ci]"
          git push origin visual-refresh
