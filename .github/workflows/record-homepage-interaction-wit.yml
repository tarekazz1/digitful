name: Record homepage interaction wit

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/record-homepage-interaction-wit.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Update project records
        run: |
          python - <<'PY'
          from pathlib import Path

          source = '6f4d8bba8b1d76b63c2d9938cecff399553b3700'
          preview_run = '35000985503'

          p = Path('docs/visual-refresh/DECISIONS.md')
          s = p.read_text()
          marker = '---\n\n## Current pending decisions'
          if '## D030 — Situational interaction wit in the homepage problem section' not in s:
              block = f'''---\n\n## D030 — Situational interaction wit in the homepage problem section\n**Status:** Approved — KEEP\n\nUse selective self-aware interface behaviour to add personality where the interaction itself demonstrates the problem. Keep the core explanation clear and visible; the joke is optional reinforcement, not required information.\n\nApproved homepage interactions:\n- `Unclear message` is a real button that expands to `Exactly. Just like this one.`\n- `Leaky conversion path` runs a small visual path that stops short of its target, then reveals `It was almost there.`\n- `Slow follow-up` starts a short millisecond timer for about 1.25 seconds, then reveals `That was only a second.` and `Some leads wait days.`\n\nInteraction rules:\n- use semantic buttons with `aria-expanded` / `aria-controls`\n- keep the normal explanatory blurbs visible without interaction\n- `prefers-reduced-motion` skips the counting/path animation and presents the final state\n- the changing millisecond counter is hidden from screen readers; announce only the final message\n- keep these expressions bespoke and selective rather than making every section interactive\n- the design system may centralize accessible disclosure/motion mechanics, but the jokes themselves are page-specific\n\nImplementation source: `{source}`.\nPreview run: `{preview_run}` — build and deploy successful.\nProduction remains untouched.\n\n'''
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          p = Path('docs/visual-refresh/HANDOFF.md')
          s = p.read_text()
          model_marker = 'Social Media, SEO, Paid Ads, and Process Automation are work areas/capabilities used to improve that system; they are not the system stages. Avoid `acquisition`, `conversion`, and `handoff` as the primary public taxonomy.\n'
          interaction_note = '''\nApproved interaction-wit principle (D030):\n- keep important copy clear and visible\n- use interface behaviour itself as the joke, selectively\n- `Unclear message` expands to `Exactly. Just like this one.`\n- `Leaky conversion path` visually stops short\n- `Slow follow-up` runs a ~1.25 second millisecond timer, then reveals `That was only a second.` / `Some leads wait days.`\n- preserve semantic disclosure controls, keyboard access, screen-reader clarity and reduced-motion fallbacks\n- keep the joke bespoke; only shared accessibility/motion mechanics belong in the design system\n'''
          if 'Approved interaction-wit principle (D030):' not in s:
              s = s.replace(model_marker, model_marker + interaction_note, 1)
          s = s.replace('- current approved messaging source: `18eca69a226fa4dc82aa08f581cbd1b5b008e4e0`', f'- current approved homepage source: `{source}`', 1)
          s = s.replace('- messaging preview run `34998050345`: build/deploy validation', f'- current homepage preview run `{preview_run}`: build success, deploy success', 1)
          status_marker = '- Instant Snapshot result-state treatment: **APPROVED — KEEP** (D026)\n'
          if '- situational homepage interaction wit: **APPROVED — KEEP** (D030)\n' not in s:
              s = s.replace(status_marker, status_marker + '- situational homepage interaction wit: **APPROVED — KEEP** (D030)\n', 1)
          p.write_text(s)

          p = Path('docs/visual-refresh/CHANGELOG.md')
          s = p.read_text().rstrip() + '\n\n'
          if '### Homepage situational interaction wit' not in s:
              s += f'''### Homepage situational interaction wit\n- **APPROVED — KEEP**.\n- Principle: clarity stays in the main copy; wit can live in the interaction when the interface itself demonstrates the problem.\n- `Unclear message` now expands to `Exactly. Just like this one.`\n- `Leaky conversion path` demonstrates a path that stops short and reveals `It was almost there.`\n- `Slow follow-up` runs a short millisecond timer (~1.25 seconds), then reveals `That was only a second.` / `Some leads wait days.`\n- Added `public/scripts/home-issue-interactions.js` and `src/assets/_homepage-interactions.scss`; kept this behaviour homepage-scoped.\n- Preserved visible explanatory copy, semantic buttons, `aria-expanded` / `aria-controls`, keyboard focus, screen-reader final-state announcement and reduced-motion fallback.\n- These jokes remain bespoke; reusable disclosure/motion mechanics may be extracted during the D028 design-system pass.\n- Source: `{source}`. Preview run `{preview_run}`: build **success**, deploy **success**.\n- Production remains untouched.\n'''
          p.write_text(s)
          PY

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "docs: record homepage interaction wit [skip ci]"
          git push origin visual-refresh
