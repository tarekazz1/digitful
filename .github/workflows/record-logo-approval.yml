name: Record approved Digitful logo

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/record-logo-approval.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Update project records
        run: |
          python - <<'PY'
          from pathlib import Path

          # DECISIONS
          p = Path('docs/visual-refresh/DECISIONS.md')
          s = p.read_text()
          start = s.index('## D024 — Concept-faithful vector logo candidate 2')
          end = s.index('---\n\n## Current pending decisions', start)
          approved = '''## D024 — Concept-faithful vector logo system\n**Status:** Approved — KEEP\n\nCandidate 2 is the approved Digitful logo system. It is traced from the approved concept artwork itself rather than regenerated from Barlow Condensed or another substitute typeface.\n\nApproved system:\n- lowercase `digitful.` wordmark with coral terminal dot\n- wider, rounder, softer custom proportions from the approved concept\n- ink-on-light and cream-on-dark primary wordmarks\n- monochrome variants using the same geometry\n- standalone `d.` mark for small contexts\n- favicon and touch/app derivatives generated from the approved standalone mark\n- shared `Logo.astro` uses the approved wordmark\n\nBarlow Condensed remains the site display/headline face only; it is not the logo lettering.\n\nProduction masters and usage rules are documented in `docs/brand/LOGO-SYSTEM.md`.\n\nThe temporary `/logo-test/` review route was removed after approval.\n\n'''
          s = s[:start] + approved + s[end:]
          s = s.replace('- Concept-faithful logo candidate 2: preview KEEP / ADJUST / REJECT.\n', '')
          p.write_text(s)

          # HANDOFF
          p = Path('docs/visual-refresh/HANDOFF.md')
          s = p.read_text()
          start = s.index('## Logo direction')
          end = s.index('## Approved homepage copy and density', start)
          logo = '''## Logo system — approved\nDecision D024: **KEEP**.\n\nSource of truth:\n`docs/brand/LOGO-SYSTEM.md`\n\nApproved system:\n- concept-faithful lowercase `digitful.` wordmark\n- coral terminal dot `#E95849`\n- ink `#191A1B` on light surfaces\n- cream `#F0E7D5` on dark surfaces\n- monochrome variants\n- standalone `d.` mark for favicons/app icons/small contexts\n- shared `Logo.astro` now uses the approved SVG masters\n- favicon + 180 / 192 / 512 px derivatives generated from the approved mark\n\nImportant:\n- candidate 1 (Barlow-derived) remains rejected\n- Barlow Condensed is the site heading face only, not the logo lettering\n- do not redraw or substitute the approved mark with a font\n\nApproved masters:\n`public/assets/brand/digitful-wordmark-on-light.svg`\n`public/assets/brand/digitful-wordmark-on-dark.svg`\n`public/assets/brand/digitful-mark-on-light.svg`\n`public/assets/brand/digitful-mark-on-dark.svg`\n\n'''
          s = s[:start] + logo + s[end:]
          # Replace preview/immediate-next block with current phase.
          if '## Preview state' in s:
              start = s.index('## Preview state')
              end = s.index('## Later implementation sequence', start)
              state = '''## Preview state\nThe concept-faithful logo candidate received KEEP. Final logo assets are now wired into the shared site shell on `visual-refresh`; the next preview pin should validate the approved logo in the real header/footer plus the finalized favicon/app derivatives.\n\nProduction `main` remains untouched.\n\n## Immediate next step\nDeploy the finalized approved-logo source SHA to preview and verify the real header/footer in light/dark and desktop/mobile.\n\nAfter that, begin the homepage structural rebuild against the approved specimen and locked copy. The old generic card-heavy homepage composition should be removed in that pass.\n\n'''
              s = s[:start] + state + s[end:]
          p.write_text(s)

          # CHANGELOG
          p = Path('docs/visual-refresh/CHANGELOG.md')
          s = p.read_text()
          start = s.index('### Logo production candidate 2 — traced from approved concept')
          approved_log = '''### Logo production candidate 2 — approved and finalized\n- **APPROVED — KEEP**.\n- Candidate 2 was traced from the approved concept artwork rather than generated from Barlow Condensed.\n- The approved geometry is now promoted to the primary SVG master paths under `public/assets/brand/`.\n- Added monochrome variants using the same approved geometry.\n- Shared `Logo.astro` now uses the approved wordmark for light/dark themes.\n- Generated a new favicon plus 180, 192 and 512 px touch/app derivatives from the approved standalone `d.` mark.\n- Updated `site.webmanifest` to the final ink/paper brand colours and approved app icons.\n- Updated `docs/brand/LOGO-SYSTEM.md` with final usage, clear-space and working minimum-size rules.\n- Removed the temporary `/logo-test/` review route after approval.\n- Decision: D024.\n- Production remains untouched.\n\n### Current preview source\n- Pending pin of the exact finalized-logo source SHA.\n\n### Next action\n- Deploy the finalized logo source to `preview.digitful.ca` and verify header/footer + favicon in real site context.\n- Then rebuild the homepage structure and remove the old generic card-heavy layout.\n'''
          # Replace from candidate-2 section to EOF because it is currently the tail state block.
          s = s[:start] + approved_log
          p.write_text(s)
          PY

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "docs: record approved Digitful logo system [skip ci]"
          git push origin visual-refresh
