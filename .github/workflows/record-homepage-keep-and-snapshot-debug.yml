name: Record homepage KEEP and snapshot debug

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/record-homepage-keep-and-snapshot-debug.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Update project records
        run: |
          python - <<'PY'
          from pathlib import Path

          # Decision log: D025 approved.
          p = Path('docs/visual-refresh/DECISIONS.md')
          s = p.read_text()
          s = s.replace(
              '## D025 — Homepage structural rebuild candidate\n**Status:** Candidate — pending preview KEEP / ADJUST / REJECT',
              '## D025 — Homepage structural rebuild\n**Status:** Approved — KEEP',
              1,
          )
          s = s.replace(
              '- Homepage structural rebuild candidate: preview KEEP / ADJUST / REJECT.\n',
              '',
              1,
          )
          p.write_text(s)

          # Handoff: record approval and current Quick Site Check diagnosis.
          p = Path('docs/visual-refresh/HANDOFF.md')
          s = p.read_text()
          s = s.replace(
              'Homepage structural rebuild candidate is deployed for review.',
              'Homepage structural rebuild is **APPROVED — KEEP**.',
              1,
          )
          old = '''## Immediate next step\nUser reviews `https://preview.digitful.ca/` on desktop/mobile and light/dark.\n\nReview scope:\n- overall structure and section order\n- hero scale/composition\n- whether open grids feel sufficiently non-card-like\n- teal Good fit section\n- Instant Snapshot layout and functional check\n- final mustard CTA\n- spacing/readability on phone and laptop\n\nResponse: KEEP / ADJUST / REJECT for the homepage structural rebuild.\n\nDo not adapt service/contact/blog page types until this homepage candidate is reviewed.\n'''
          new = '''## Immediate next step\nResolve the Quick Site Check preview failure before moving to the next page type.\n\nCurrent evidence:\n- user approved the homepage structural rebuild\n- direct navigation to the Cloudflare Worker with `https://digitful.ca` returns a full PageSpeed JSON payload including `lighthouseResult`\n- browser `fetch()` from `https://preview.digitful.ca` fails with `TypeError: Failed to fetch`\n- Google API key is restricted to the PageSpeed Insights API but has **no application restriction**, so the key itself is not blocked by preview referrer/IP rules\n- this strongly points to a Worker CORS/origin-policy issue between preview and the Worker rather than a Google PageSpeed API failure\n\nDiagnostic preview source:\n`73cf73e4d9a2b0a9e937158614891192c48f2148`\n\nDiagnostic preview run:\n`34984708246` — build success, deploy success.\n\nNext check: inspect the Cloudflare Worker CORS/allowed-origin logic and allow `https://preview.digitful.ca` alongside production without weakening the production secret/API-key model.\n'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Changelog: append approval and diagnostic finding.
          p = Path('docs/visual-refresh/CHANGELOG.md')
          s = p.read_text().rstrip() + '\n\n'
          if '### Homepage structural rebuild approved' not in s:
              s += '''### Homepage structural rebuild approved\n- **APPROVED — KEEP** after desktop/mobile and light/dark review.\n- Reviewed source remains `0c828a806093e7b287b4228170d60a6602cf14b7`.\n- Decision D025 is now approved.\n- Production remains untouched.\n\n### Quick Site Check diagnostic\n- User tested `https://digitful.ca` with both mobile and desktop and the preview returned a generic analysis failure.\n- Added temporary preview diagnostics in source `73cf73e4d9a2b0a9e937158614891192c48f2148`; preview run `34984708246` built and deployed successfully.\n- Browser diagnostic: `Could not reach the audit service: Failed to fetch`.\n- Opening the Worker endpoint directly returns a valid full PageSpeed response with `lighthouseResult`, so Worker → Google PageSpeed is functioning.\n- Google API key is limited to PageSpeed Insights API but has no application restriction.\n- Current leading diagnosis: CORS/origin policy on the Cloudflare Worker does not allow `https://preview.digitful.ca`.\n- Resolve this functional issue before moving to the next page type.\n'''
          p.write_text(s)
          PY

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "docs: record homepage KEEP and snapshot diagnosis [skip ci]"
          git push origin visual-refresh
