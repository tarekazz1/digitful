name: Record homepage messaging model

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/record-homepage-messaging-model.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Update project records
        run: |
          python - <<'PY'
          from pathlib import Path

          source = '18eca69a226fa4dc82aa08f581cbd1b5b008e4e0'
          preview_run = '34998050345'

          p = Path('docs/visual-refresh/DECISIONS.md')
          s = p.read_text()
          s = s.replace('- Core offers: `Four parts. One growth system.`', '- Core work areas: `This is where we usually get involved.`', 1)
          marker = '---\n\n## Current pending decisions'
          if '## D029 — Plain-language public growth-system model' not in s:
              block = f'''---\n\n## D029 — Plain-language public growth-system model\n**Status:** Approved\n\nThe homepage had two competing definitions of the growth system: the hero used `strategy / acquisition / handoff / automation`, while the work-area section implied that Social Media / SEO / Paid Ads / Process Automation were the four parts of the system. That ambiguity is removed.\n\nPublic-facing system model:\n1. **Say the right thing**\n2. **Reach the right people**\n3. **Make action easy**\n4. **Follow through**\n\nMessaging rules:\n- Social Media, SEO, Paid Ads, and Process Automation are practical **work areas/capabilities**, not the four stages of the system.\n- Do not use `acquisition`, `conversion`, or `handoff` as the main public-facing taxonomy when clearer language is available.\n- Keep `What we actually do` as the work-area eyebrow; it is clearer and less generic than `Our services`.\n- Work-area headline: `This is where we usually get involved.`\n- Hero support line: `Marketing works better when the whole journey works together.`\n- The hero system map carries the four-part plain-language model above.\n\n`docs/brand/HOMEPAGE-COPY.md` is updated as the copy source of truth.\n\nImplementation source: `{source}`.\nPreview run: `{preview_run}`.\nProduction remains untouched.\n\n'''
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          p = Path('docs/visual-refresh/HANDOFF.md')
          s = p.read_text()
          s = s.replace('- Hero support: `Strategy, acquisition, and automation built to work together.`', '- Hero support: `Marketing works better when the whole journey works together.`', 1)
          s = s.replace('- `Four parts. One growth system.`', '- Work-area headline: `This is where we usually get involved.`', 1)
          key = 'Header CTA: `Talk to Digitful`.\n'
          model = '''\nApproved public growth-system model (D029):\n- `Say the right thing`\n- `Reach the right people`\n- `Make action easy`\n- `Follow through`\n\nSocial Media, SEO, Paid Ads, and Process Automation are work areas/capabilities used to improve that system; they are not the system stages. Avoid `acquisition`, `conversion`, and `handoff` as the primary public taxonomy.\n'''
          if 'Approved public growth-system model (D029):' not in s:
              s = s.replace(key, key + model, 1)
          s = s.replace('- final hero support line: `Strategy, acquisition, and automation built to work together.`', '- final hero support line: `Marketing works better when the whole journey works together.`', 1)
          s = s.replace('- final approved rendered source: `c914f6252ec30d99a4adf3979cd5593b5f6ca68d`', f'- current approved messaging source: `{source}`', 1)
          s = s.replace('- preview run `34992817965`: build success, deploy success', f'- messaging preview run `{preview_run}`: build/deploy validation', 1)
          p.write_text(s)

          p = Path('docs/visual-refresh/CHANGELOG.md')
          s = p.read_text().rstrip() + '\n\n'
          if '### Homepage messaging model clarified' not in s:
              s += f'''### Homepage messaging model clarified\n- **APPROVED** plain-language system model: `Say the right thing → Reach the right people → Make action easy → Follow through`.\n- Removed the conflicting public taxonomy `Strategy / Acquisition / Handoff / Automation` from the hero map.\n- Clarified that Social Media, SEO, Paid Ads and Process Automation are work areas/capabilities, not the four stages of the system.\n- Replaced `Four parts. One growth system.` with `This is where we usually get involved.` under `What we actually do`.\n- Hero support is now `Marketing works better when the whole journey works together.`\n- Updated the homepage meta description to use the same plain-language framing.\n- Updated `docs/brand/HOMEPAGE-COPY.md` as the source of truth.\n- Source: `{source}`. Preview run `{preview_run}`.\n- Production remains untouched.\n'''
          p.write_text(s)
          PY

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "docs: record homepage messaging model [skip ci]"
          git push origin visual-refresh
