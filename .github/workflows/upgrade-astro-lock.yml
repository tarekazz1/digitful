name: Upgrade Astro lockfile

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/upgrade-astro-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual-refresh
        uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade Astro and refresh lockfile
        run: npm install astro@7.3.2 --save-exact

      - name: Verify build
        run: npm run build

      - name: Commit upgraded package files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Astro to 7.3.2 [skip ci]"
          git push origin HEAD:visual-refresh
