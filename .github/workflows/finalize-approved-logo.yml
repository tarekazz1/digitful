name: Finalize approved Digitful logo

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/finalize-approved-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual-refresh
        uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG renderer
        run: pip install cairosvg

      - name: Promote approved candidate and generate derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import cairosvg

          root = Path('.')
          src = root / 'public/assets/brand/candidate-2'
          brand = root / 'public/assets/brand'
          images = root / 'public/assets/images'

          files = {
              'digitful-wordmark-on-light.svg': 'digitful-wordmark-on-light.svg',
              'digitful-wordmark-on-dark.svg': 'digitful-wordmark-on-dark.svg',
              'digitful-mark-on-light.svg': 'digitful-mark-on-light.svg',
              'digitful-mark-on-dark.svg': 'digitful-mark-on-dark.svg',
          }
          for source, dest in files.items():
              shutil.copyfile(src / source, brand / dest)

          # Monochrome variants keep the approved geometry and remove the coral accent.
          light = (src / 'digitful-wordmark-on-light.svg').read_text()
          dark = (src / 'digitful-wordmark-on-dark.svg').read_text()
          (brand / 'digitful-wordmark-mono-ink.svg').write_text(light.replace('#E95849', '#191A1B'))
          (brand / 'digitful-wordmark-mono-cream.svg').write_text(dark.replace('#E95849', '#F0E7D5'))

          # Compatibility copies for any legacy references.
          shutil.copyfile(brand / 'digitful-wordmark-on-dark.svg', images / 'logo.svg')
          shutil.copyfile(brand / 'digitful-wordmark-on-light.svg', images / 'logo-light.svg')

          # A self-contained square favicon: warm paper background + approved ink/coral d. mark.
          mark = (brand / 'digitful-mark-on-light.svg').read_text()
          mark = mark.replace('<svg ', '<svg ' , 1)
          insert_at = mark.find('>') + 1
          mark = mark[:insert_at] + '\n<rect width="603" height="603" rx="54" fill="#F0E7D5"/>' + mark[insert_at:]
          (root / 'public/favicon.svg').write_text(mark)

          # Raster derivatives for touch/app contexts.
          for size, target in [
              (180, root / 'public/apple-touch-icon.png'),
              (192, root / 'public/android-chrome-192x192.png'),
              (512, root / 'public/android-chrome-512x512.png'),
          ]:
              cairosvg.svg2png(bytestring=mark.encode(), write_to=str(target), output_width=size, output_height=size)

          (root / 'public/site.webmanifest').write_text(
              '{"name":"Digitful","short_name":"Digitful","icons":['
              '{"src":"/android-chrome-192x192.png","sizes":"192x192","type":"image/png"},'
              '{"src":"/android-chrome-512x512.png","sizes":"512x512","type":"image/png"}],'
              '"theme_color":"#191A1B","background_color":"#F0E7D5","display":"standalone"}\n'
          )
          PY

      - name: Commit finalized logo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/brand public/assets/images/logo.svg public/assets/images/logo-light.svg public/favicon.svg public/apple-touch-icon.png public/android-chrome-192x192.png public/android-chrome-512x512.png public/site.webmanifest
          git commit -m "feat: promote approved Digitful logo system [skip ci]"
          git push origin visual-refresh
