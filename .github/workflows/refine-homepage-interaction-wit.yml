name: Refine homepage interaction wit

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/refine-homepage-interaction-wit.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize current copy block
        run: python scripts/prepare-d031-copy.py
      - name: Apply D031
        run: python scripts/apply-d031.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/assets/_homepage-interactions.scss public/scripts/home-issue-interactions.js docs/brand/HOMEPAGE-COPY.md docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "refine: compact homepage interaction wit [skip ci]"
          git push origin visual-refresh
