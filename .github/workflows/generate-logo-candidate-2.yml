name: Generate logo candidate 2

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/generate-logo-candidate-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual-refresh
        uses: actions/checkout@v4
        with:
          ref: visual-refresh
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install tracing tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Trace approved concept artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          import cv2

          ROOT = Path('docs/brand/logo-concepts/2026-09-retro-direction')
          WORDMARK = ROOT / 'digitful-wordmark-primary-dark-coral.png'
          MARK = ROOT / 'digitful-mark-d-coral-dark.png'
          OUT = Path('public/assets/brand/candidate-2')
          OUT.mkdir(parents=True, exist_ok=True)

          INK = '#191A1B'
          CREAM = '#F0E7D5'
          CORAL = '#E95849'

          def remove_edge_component(mask):
              n, labels, stats, _ = cv2.connectedComponentsWithStats(mask.astype(np.uint8), 8)
              out = np.zeros_like(mask, dtype=np.uint8)
              h, w = mask.shape
              for i in range(1, n):
                  x, y, cw, ch, area = stats[i]
                  touches_edge = x == 0 or y == 0 or x + cw >= w or y + ch >= h
                  if area >= 300 and not touches_edge:
                      out[labels == i] = 255
              return out

          def clean(mask, min_area=300, discard_edge=False):
              mask = mask.astype(np.uint8)
              if discard_edge:
                  out = remove_edge_component(mask)
              else:
                  n, labels, stats, _ = cv2.connectedComponentsWithStats(mask, 8)
                  out = np.zeros_like(mask, dtype=np.uint8)
                  for i in range(1, n):
                      if stats[i, cv2.CC_STAT_AREA] >= min_area:
                          out[labels == i] = 255
              return cv2.morphologyEx(out, cv2.MORPH_CLOSE, np.ones((3,3), np.uint8), iterations=1)

          def load_masks(path, mode):
              arr = np.array(Image.open(path).convert('RGBA'))
              a = arr[..., 3]
              rgb = arr[..., :3]
              brightness = rgb.mean(axis=2)
              coral = (rgb[...,0] > 170) & (rgb[...,1] < 155) & (rgb[...,2] < 140) & (a > 40)
              coral = clean(coral, 300)

              if mode == 'wordmark':
                  body = (a > 80) & (~coral.astype(bool)) & (brightness > 150)
                  body = clean(body, 300)
              else:
                  body = (a > 80) & (~coral.astype(bool)) & (brightness < 120)
                  body_no_edge = clean(body, 300, discard_edge=True)
                  body = body_no_edge if body_no_edge.sum() > 1000 else clean(body, 300)
              return body, coral

          def bbox_union(*masks, pad=18):
              ys, xs = [], []
              for m in masks:
                  y, x = np.nonzero(m)
                  ys.append(y); xs.append(x)
              y = np.concatenate(ys); x = np.concatenate(xs)
              x0 = max(0, int(x.min()) - pad)
              y0 = max(0, int(y.min()) - pad)
              x1 = int(x.max()) + 1 + pad
              y1 = int(y.max()) + 1 + pad
              return x0, y0, x1, y1

          def to_path(mask, offset, eps=0.65):
              contours, _ = cv2.findContours(mask, cv2.RETR_TREE, cv2.CHAIN_APPROX_NONE)
              ox, oy = offset
              chunks = []
              for contour in contours:
                  if abs(cv2.contourArea(contour)) < 10:
                      continue
                  pts = cv2.approxPolyDP(contour, eps, True)[:,0,:]
                  if len(pts) < 3:
                      continue
                  chunks.append(f'M {pts[0,0]-ox:.2f} {pts[0,1]-oy:.2f}')
                  chunks.extend(f'L {x-ox:.2f} {y-oy:.2f}' for x, y in pts[1:])
                  chunks.append('Z')
              return ' '.join(chunks)

          def render(path, mode, body_fill, square=False):
              body, coral = load_masks(path, mode)
              x0, y0, x1, y1 = bbox_union(body, coral)
              w, h = x1-x0, y1-y0
              body_path = to_path(body, (x0,y0))
              coral_path = to_path(coral, (x0,y0))
              transform = ''
              if square:
                  side = max(w,h)
                  dx, dy = (side-w)/2, (side-h)/2
                  viewbox = f'0 0 {side} {side}'
                  transform = f' transform="translate({dx:.2f} {dy:.2f})"'
              else:
                  viewbox = f'0 0 {w} {h}'
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="{viewbox}" role="img" aria-label="Digitful" shape-rendering="geometricPrecision">\n'
                  f'<g{transform}>\n'
                  f'<path d="{body_path}" fill="{body_fill}" fill-rule="evenodd"/>\n'
                  f'<path d="{coral_path}" fill="{CORAL}" fill-rule="evenodd"/>\n'
                  f'</g>\n</svg>\n'
              )

          files = {
              'digitful-wordmark-on-light.svg': render(WORDMARK, 'wordmark', INK),
              'digitful-wordmark-on-dark.svg': render(WORDMARK, 'wordmark', CREAM),
              'digitful-mark-on-light.svg': render(MARK, 'mark', INK, square=True),
              'digitful-mark-on-dark.svg': render(MARK, 'mark', CREAM, square=True),
          }
          for name, content in files.items():
              (OUT / name).write_text(content, encoding='utf-8')
          PY

      - name: Restore pre-candidate favicon and remove rejected raster derivatives
        shell: bash
        run: |
          git show 12ad2246ad73344bbf33674bf8eb2585e7d10b2e:public/favicon.svg > public/favicon.svg
          git rm -f public/apple-touch-icon.png public/android-chrome-192x192.png public/android-chrome-512x512.png 2>/dev/null || true

      - name: Commit candidate 2 assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/brand/candidate-2 public/favicon.svg
          git add -u public
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add concept-faithful logo candidate 2 [skip ci]"
          git push origin HEAD:visual-refresh
