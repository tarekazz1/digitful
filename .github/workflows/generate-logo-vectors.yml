name: Generate final logo vectors

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/generate-logo-vectors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual-refresh
        uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install vector tooling
        run: python -m pip install --disable-pip-version-check fonttools cairosvg

      - name: Fetch Barlow Condensed ExtraBold source font
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-ExtraBold.ttf \
            -o /tmp/BarlowCondensed-ExtraBold.ttf

      - name: Generate outlined SVG masters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.pens.svgPathPen import SVGPathPen
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.boundsPen import BoundsPen

          FONT_PATH = '/tmp/BarlowCondensed-ExtraBold.ttf'
          OUT = Path('public/assets/brand')
          OUT.mkdir(parents=True, exist_ok=True)

          INK = '#191A1B'
          CREAM = '#F0E7D5'
          CORAL = '#E95849'
          TRACKING = -12

          font = TTFont(FONT_PATH)
          glyph_set = font.getGlyphSet()
          cmap = font.getBestCmap()
          hmtx = font['hmtx'].metrics

          def build_paths(text: str):
              body_pen = SVGPathPen(glyph_set)
              accent_pen = SVGPathPen(glyph_set)
              bounds_pen = BoundsPen(glyph_set)
              x = 0

              for index, char in enumerate(text):
                  glyph_name = cmap[ord(char)]
                  target = accent_pen if char == '.' else body_pen
                  glyph = glyph_set[glyph_name]
                  glyph.draw(TransformPen(target, (1, 0, 0, 1, x, 0)))
                  glyph.draw(TransformPen(bounds_pen, (1, 0, 0, 1, x, 0)))
                  advance = hmtx[glyph_name][0]
                  x += advance
                  if index < len(text) - 1:
                      x += TRACKING

              if not bounds_pen.bounds:
                  raise RuntimeError(f'No bounds for {text!r}')

              return body_pen.getCommands(), accent_pen.getCommands(), bounds_pen.bounds

          def transform_for(bounds, width, height, pad_x, pad_y):
              min_x, min_y, max_x, max_y = bounds
              glyph_w = max_x - min_x
              glyph_h = max_y - min_y
              scale = min((width - 2 * pad_x) / glyph_w, (height - 2 * pad_y) / glyph_h)
              drawn_w = glyph_w * scale
              drawn_h = glyph_h * scale
              tx = (width - drawn_w) / 2 - min_x * scale
              ty = (height - drawn_h) / 2 + max_y * scale
              return tx, ty, scale

          def render_svg(text, width, height, body_fill, dot_fill, pad_x, pad_y, background=None, radius=0):
              body_path, dot_path, bounds = build_paths(text)
              tx, ty, scale = transform_for(bounds, width, height, pad_x, pad_y)
              bg = ''
              if background:
                  bg = f'<rect width="{width}" height="{height}" rx="{radius}" fill="{background}"/>'
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}" '
                  f'role="img" aria-label="Digitful" shape-rendering="geometricPrecision">'
                  f'{bg}'
                  f'<g transform="translate({tx:.4f} {ty:.4f}) scale({scale:.6f} {-scale:.6f})">'
                  f'<path d="{body_path}" fill="{body_fill}"/>'
                  f'<path d="{dot_path}" fill="{dot_fill}"/>'
                  f'</g></svg>\n'
              )

          variants = {
              'digitful-wordmark-on-light.svg': render_svg('digitful.', 600, 160, INK, CORAL, 24, 22),
              'digitful-wordmark-on-dark.svg': render_svg('digitful.', 600, 160, CREAM, CORAL, 24, 22),
              'digitful-wordmark-mono-ink.svg': render_svg('digitful.', 600, 160, INK, INK, 24, 22),
              'digitful-wordmark-mono-cream.svg': render_svg('digitful.', 600, 160, CREAM, CREAM, 24, 22),
              'digitful-mark-on-light.svg': render_svg('d.', 160, 160, INK, CORAL, 24, 24),
              'digitful-mark-on-dark.svg': render_svg('d.', 160, 160, CREAM, CORAL, 24, 24),
          }

          for name, svg in variants.items():
              (OUT / name).write_text(svg, encoding='utf-8')

          Path('public/assets/images/logo.svg').write_text(variants['digitful-wordmark-on-dark.svg'], encoding='utf-8')
          Path('public/assets/images/logo-light.svg').write_text(variants['digitful-wordmark-on-light.svg'], encoding='utf-8')

          Path('public/favicon.svg').write_text(
              render_svg('d.', 160, 160, CREAM, CORAL, 24, 24, background=INK, radius=10),
              encoding='utf-8'
          )
          PY

      - name: Generate app icon PNGs
        shell: bash
        run: |
          python - <<'PY'
          import cairosvg
          for size, output in [
              (192, 'public/android-chrome-192x192.png'),
              (512, 'public/android-chrome-512x512.png'),
              (180, 'public/apple-touch-icon.png'),
          ]:
              cairosvg.svg2png(
                  url='public/favicon.svg',
                  write_to=output,
                  output_width=size,
                  output_height=size,
              )
          PY

      - name: Commit generated logo masters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/brand \
            public/assets/images/logo.svg \
            public/assets/images/logo-light.svg \
            public/favicon.svg \
            public/android-chrome-192x192.png \
            public/android-chrome-512x512.png \
            public/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "No logo changes to commit."
            exit 0
          fi
          git commit -m "feat: add Digitful logo raster derivatives [skip ci]"
          git push origin HEAD:visual-refresh
