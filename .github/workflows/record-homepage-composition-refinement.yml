name: Record homepage composition refinement

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/record-homepage-composition-refinement.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh

      - name: Update project records
        run: |
          python - <<'PY'
          from pathlib import Path

          source = '4f7651731bad87fc9ca3b97aa0a24c2905c78517'
          preview_run = '34989464135'

          p = Path('docs/visual-refresh/DECISIONS.md')
          s = p.read_text()
          marker = '---\n\n## Current pending decisions'
          if '## D027 — Homepage whole-page composition refinement' not in s:
              block = f'''---\n\n## D027 — Homepage whole-page composition refinement\n**Status:** Candidate — pending preview KEEP / ADJUST / REJECT\n\nAfter zoomed-out desktop review, keep the approved homepage structure and reduced copy but move the implementation closer to the approved visual references. The first structural build was too static, too vertically stretched, and repeated square ruled layouts too mechanically.\n\nCandidate direction:\n- keep the technical graph-paper grid language in the hero system map and Instant Snapshot\n- tighten section height and vertical rhythm\n- restore flat coral / mustard / teal circular icon markers\n- use open columns and rules instead of enclosing every item\n- strengthen the hero visual with accent geometry, handwritten-style annotations and a printed-mechanical offset treatment\n- introduce restrained mechanical hover movement while preserving `prefers-reduced-motion`\n- preserve the locked reduced-copy hierarchy; do not reintroduce the removed summary paragraphs or decorative benefit strip\n- preserve all Snapshot functionality and the D026 result-state treatment\n- production remains untouched\n\nImplementation includes a small reusable inline-SVG homepage icon component rather than adding new icon-font dependencies.\n\nCandidate source: `{source}`.\nPreview run: `{preview_run}` — build and deploy successful.\n\n'''
              s = s.replace(marker, block + marker, 1)
          pending = '## Current pending decisions\n'
          line = '- Homepage whole-page composition refinement: preview KEEP / ADJUST / REJECT.\n'
          if line not in s:
              s = s.replace(pending, pending + line, 1)
          p.write_text(s)

          p = Path('docs/visual-refresh/HANDOFF.md')
          s = p.read_text()
          start = s.index('## Immediate next step')
          end = s.index('## Later implementation sequence', start)
          state = f'''## Immediate next step\nReview the **whole homepage composition refinement** at `https://preview.digitful.ca/` before moving to another page type.\n\nWhy this pass exists:\n- zoomed-out desktop review showed excessive vertical dead space and too much repeated ruled-box geometry\n- the approved references have more graphic rhythm: circular icons, accent shapes, annotations, visual movement and more open editorial columns\n- the user explicitly wants to keep the current technical grid language while restoring those missing cues\n\nCandidate changes:\n- tighter hero and section rhythm\n- larger/more graphic hero system-map treatment with coral/mustard accents and annotations\n- inline SVG icon discs for What we fix, Services and Good fit\n- open ruled columns rather than repeated enclosing boxes\n- Good fit remains a teal split moment but is tighter and more graphic\n- mobile converts these sections to icon-led editorial rows\n- restrained hover movement with reduced-motion fallback\n- locked reduced copy remains unchanged\n- Instant Snapshot functionality and the D026 result state remain intact\n\nCandidate source:\n`{source}`\n\nPreview run:\n`{preview_run}` — build success, deploy success.\n\nReview desktop/mobile and light/dark, preferably including a zoomed-out desktop view. Final homepage KEEP should close both this composition pass and the still-pending D026 Snapshot result-state visual treatment.\n\n'''
          s = s[:start] + state + s[end:]
          p.write_text(s)

          p = Path('docs/visual-refresh/CHANGELOG.md')
          s = p.read_text().rstrip() + '\n\n'
          if '### Homepage whole-page composition refinement candidate' not in s:
              s += f'''### Homepage whole-page composition refinement candidate\n- Status: **PENDING USER REVIEW**.\n- Candidate source: `{source}`.\n- Preview run `{preview_run}`: build **success**, deploy **success**.\n- Trigger: zoomed-out desktop review showed too much dead vertical space, overly mechanical repeated ruled boxes, a hero visual that was too small/UI-like, and insufficient icon/annotation/colour rhythm compared with the approved references.\n- Added `src/components/HomeIcon.astro` with lightweight inline SVG icons for homepage editorial markers.\n- Kept the current graph-paper system-map and Snapshot grid language, but strengthened the hero with accent geometry, annotations and a hard printed offset.\n- Reworked What we fix and Services into tighter open editorial rows with circular coral/mustard/teal icons and rules rather than enclosing every item.\n- Tightened Good fit and converted its supporting items to icon-led columns while retaining the teal split identity.\n- Added restrained mechanical hover movement and preserved reduced-motion behaviour.\n- Mobile now uses icon-led editorial rows rather than miniature desktop grids.\n- Locked reduced homepage copy remains unchanged; removed summary paragraphs and the decorative benefit strip were not reintroduced.\n- Snapshot Worker/API behaviour and the D026 result-state treatment remain unchanged.\n- Production remains untouched.\n'''
          p.write_text(s)
          PY

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "docs: record homepage composition refinement [skip ci]"
          git push origin visual-refresh
