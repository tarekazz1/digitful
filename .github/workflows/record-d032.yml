name: Record D032

on:
  push:
    branches: [visual-refresh]
    paths:
      - '.github/workflows/record-d032.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh
      - name: Update records
        run: python scripts/record-d032.py
      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/DECISIONS.md docs/visual-refresh/HANDOFF.md docs/visual-refresh/CHANGELOG.md
          git commit -m "docs: record D032 homepage message refinements [skip ci]"
          git push origin visual-refresh
